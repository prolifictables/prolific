services:
  - type: web
    name: prolific-api
    runtime: node
    plan: free
    region: oregon

    # NOTE ON BUILD COMMAND (professional Render monorepo pattern):
    # ---------------------------------------------------------------------------
    # If you have EVER set "Build Command" manually in the Render Web Service
    # Dashboard → Environment tab, THAT manual override ALWAYS TAKES PRECEDENCE
    # over render.yaml. If the deployed build still shows the OLD plain
    # `npm ci && npx turbo...` in logs despite having this file committed, go
    # to the Dashboard → Environment and DELETE the manual Build Command entry
    # (or paste this exact line there).
    #
    # Key flags:
    #   --include=dev         : Overrides NODE_ENV=production implicit
    #                         : --omit=dev. Installs ALL devDependencies across
    #                         : ROOT (turbo, typescript, @types/node) AND ALL
    #                         : workspaces (shared-package @types/node, tsc).
    #                         : This is the standard npm CI flag for TypeScript
    #                         : monorepos where build tools ARE devDeps.
    #                         : (Prior failure root cause: NODE_ENV=production
    #                         : in envVars caused npm ci to skip EVERY devDep
    #                         : → turbo missing + @types/node missing →
    #                         : crypto TS2591.)
    #   --ignore-scripts      : Skip postinstall hooks. The POS/Electron
    #                         : workspace's better-sqlite3 native C++ postinstall
    #                         : is POS-only and we never run it for server build
    #                         : anyway (saves 5+ min, avoids V8 signature crash
    #                         : on Node 26.x should pin ever slip).
    #   NODE_ENV=production   : Only applied to TURBO/NESTJS build phase — Nest
    #                         : needs this for webpack mode, ORM prod configs,
    #                         : sourcemap stripping etc. npm ci above doesn't
    #                         : need NODE_ENV prefix since --include=dev makes
    #                         : install behavior unambiguous.
    buildCommand: npm ci --include=dev --ignore-scripts && NODE_ENV=production npx turbo run build --filter=@prolific/server...
    startCommand: npm run start:prod --workspace=@prolific/server

    healthCheckPath: /api/v1

    buildFilter:
      paths:
        - server/**
        - packages/**
        - package.json
        - package-lock.json
        - turbo.json
        - render.yaml

    envVars:
      - key: NODE_VERSION
        value: "20.17.0"

      - key: NODE_ENV
        value: production

      - key: MONGODB_URI
        sync: false

      - key: JWT_ACCESS_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: JWT_ACCESS_TTL_SECONDS
        value: "1800"

      - key: JWT_REFRESH_TTL_SECONDS
        value: "604800"

      - key: JWT_ISSUER
        value: prolific.pos

      - key: JWT_AUDIENCE
        value: prolific.clients

      - key: CORS_ORIGIN
        value: https://prolifictables.com

      - key: DEFAULT_PAYMENT_PROVIDER
        value: PAYSTACK

      - key: PAYSTACK_SECRET_KEY
        sync: false

      - key: PAYSTACK_PUBLIC_KEY
        sync: false

      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false

      - key: FLUTTERWAVE_SECRET_KEY
        sync: false

      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false

      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false

      - key: SEED_ENABLED
        value: "true"

      - key: SEED_RUN_ONCE
        value: "true"

      - key: SEED_SUPERADMIN_EMAIL
        value: superadmin@prolific.ai

      - key: SEED_SUPERADMIN_PASSWORD
        sync: false

      - key: SEED_SUPERADMIN_FIRSTNAME
        value: Super

      - key: SEED_SUPERADMIN_LASTNAME
        value: Admin

      - key: RATE_LIMIT_AUTH
        value: "20"

      - key: RATE_LIMIT_DEFAULT
        value: "500"
